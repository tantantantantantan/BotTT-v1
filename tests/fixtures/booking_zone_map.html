<div id="seats"></div>
<div id="popup_alert" style="display:none">Zone is not available. <a href="#" onclick="this.parentNode.style.display='none';return false;" class="fancybox-close">Close</a></div>
<script>
  window.zoneClicks = [];
  // Zones listed in ?soldout=A1,A2 never load a seat map.
  var soldout = (new URLSearchParams(location.search).get('soldout') || '').split(',');
  function selectzone(href, ev) {
    var z = href.split('#').pop();
    window.zoneClicks.push({zone: z, trusted: !!(ev && ev.isTrusted)});
    if (soldout.indexOf(z) >= 0) {
      if (new URLSearchParams(location.search).get('popup') === '1') {
        document.getElementById('popup_alert').style.display = 'block';
      }
      return false;
    }
    setTimeout(function () {
      var html = '<table id="tableseats"><tr>';
      for (var i = 1; i <= 6; i++) {
        html += '<td title="' + z + '-A' + i + '" data-info=\'{"id":"' + i + '","seat":"3500","seatk":"k' + i + '"}\'></td>';
      }
      document.getElementById('seats').innerHTML = html + '</tr></table>';
    }, 150);
    return false;
  }
</script>
